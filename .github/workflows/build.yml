name: Build ATMOSPHERE 21.5.0 Support

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"

  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    # Official devkitPro Nintendo Switch / devkitA64 toolchain image.
    # This replaces wget, dpkg, dkp-pacman, switch-dev, and devkitA64 setup.
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            git \
            liblz4-dev \
            python3 \
            python3-pip

          python3 -m pip install --no-cache-dir --break-system-packages pyelftools

      - name: Show toolchain versions
        shell: bash
        run: |
          set -euo pipefail

          echo "DEVKITPRO=${DEVKITPRO:-not set}"
          echo "DEVKITA64=${DEVKITA64:-not set}"

          aarch64-none-elf-gcc --version
          make --version
          python3 --version

      - name: Build project
        shell: bash
        run: |
          set -euo pipefail

          make clean || true
          make -j"$(nproc)"

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          find . \
            -type f \
            \( \
              -name "*.nro" -o \
              -name "*.elf" -o \
              -name "*.kip" -o \
              -name "*.kip1" -o \
              -name "*.ovl" -o \
              -name "*.nsp" \
            \) \
            -not -path "./.git/*" \
            -exec cp --parents {} artifacts/ \;

          echo "Collected files:"
          find artifacts -type f -print || true

          if ! find artifacts -type f -print -quit | grep -q .; then
            echo "::error::Build finished, but no expected artifact files were found."
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ATMOSPHERE_21.5.0_Support
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

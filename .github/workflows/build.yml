name: Build ATMOSPHERE 21.5.0 Support

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"

  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Atmosphere
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      PATH: /opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin:/opt/devkitpro/portlibs/switch/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Update devkitPro Switch dependencies
        shell: bash
        run: |
          set -euo pipefail

          dkp-pacman -Syu --noconfirm

          dkp-pacman -S --needed --noconfirm \
            devkitA64 \
            switch-dev \
            switch-tools

      - name: Install project dependencies
        shell: bash
        run: |
          set -euo pipefail

          apt-get update

          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            git \
            liblz4-dev \
            python3 \
            python3-pip

          python3 -m pip install \
            --no-cache-dir \
            --break-system-packages \
            pyelftools

      - name: Verify toolchain and libnx
        shell: bash
        run: |
          set -euo pipefail

          echo "DEVKITPRO=${DEVKITPRO}"
          echo "DEVKITA64=${DEVKITA64}"
          echo

          test -x "${DEVKITA64}/bin/aarch64-none-elf-gcc"

          echo "=== devkitA64 ==="
          aarch64-none-elf-gcc --version
          echo

          echo "=== Installed devkitPro packages ==="
          dkp-pacman -Q | grep -E '^(devkitA64|libnx|switch-)'
          echo

          echo "=== Required libnx PGL API checks ==="
          grep -R \
            --line-number \
            --include="*.h" \
            "pglEventObserverGetShellEvent" \
            "${DEVKITPRO}/libnx/include" \
            || {
              echo "::error::Installed libnx does not contain pglEventObserverGetShellEvent."
              exit 1
            }

          grep -R \
            --line-number \
            --include="*.h" \
            "pglGetHostProgramLaunchProperty" \
            "${DEVKITPRO}/libnx/include" \
            || {
              echo "::error::Installed libnx does not contain pglGetHostProgramLaunchProperty."
              exit 1
            }

      - name: Build Atmosphere
        shell: bash
        run: |
          set -euo pipefail

          make clean || true
          make -j"$(nproc)"

      - name: Prepare artifact directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf artifacts
          mkdir -p artifacts

          if [ -d "output" ]; then
            cp -a output/. artifacts/
          fi

          if [ -d "atmosphere" ]; then
            cp -a atmosphere artifacts/
          fi

          if [ -f "fusee.bin" ]; then
            cp -a fusee.bin artifacts/
          fi

          if [ -f "exosphere.bin" ]; then
            cp -a exosphere.bin artifacts/
          fi

          if [ -f "stratosphere.romfs" ]; then
            cp -a stratosphere.romfs artifacts/
          fi

          echo "=== Release artifact contents ==="
          find artifacts -type f -print | sort || true

          if ! find artifacts -type f -print -quit | grep -q .; then
            echo "::error::The build completed, but no expected release files were found."
            exit 1
          fi

      - name: Upload Atmosphere build
        uses: actions/upload-artifact@v4
        with:
          name: ATMOSPHERE_21.5.0_Support
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

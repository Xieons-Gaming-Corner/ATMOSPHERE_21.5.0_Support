name: Build ATMOSPHERE 21.5.0 Support

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"

  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    # Official devkitPro Nintendo Switch / devkitA64 build environment.
    container:
      image: devkitpro/devkita64:latest

    # devkitPro is installed in the container but the devkitA64 compiler
    # directory is not automatically included in PATH.
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      PATH: /opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin:/opt/devkitpro/portlibs/switch/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install project dependencies
        shell: bash
        run: |
          set -euo pipefail

          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            git \
            liblz4-dev \
            python3 \
            python3-pip

          python3 -m pip install \
            --no-cache-dir \
            --break-system-packages \
            pyelftools

      - name: Verify devkitPro toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "DEVKITPRO=${DEVKITPRO}"
          echo "DEVKITA64=${DEVKITA64}"
          echo "PATH=${PATH}"

          test -x "${DEVKITA64}/bin/aarch64-none-elf-gcc"

          echo
          echo "=== Compiler ==="
          aarch64-none-elf-gcc --version

          echo
          echo "=== Build tools ==="
          make --version
          python3 --version

          echo
          echo "=== Switch environment ==="
          if [ -f "${DEVKITPRO}/switchvars.sh" ]; then
            source "${DEVKITPRO}/switchvars.sh"
            echo "LIBNX=${LIBNX:-not set}"
            echo "PORTLIBS_PREFIX=${PORTLIBS_PREFIX:-not set}"
          fi

      - name: Build project
        shell: bash
        run: |
          set -euo pipefail

          make clean || true
          make -j"$(nproc)"

      - name: Collect build artifacts
        shell: bash
        run: |
          set -euo pipefail

          rm -rf artifacts
          mkdir -p artifacts

          while IFS= read -r -d '' file; do
            cp --parents "$file" artifacts/
          done < <(
            find . \
              -type f \
              \( \
                -name "*.nro" -o \
                -name "*.elf" -o \
                -name "*.kip" -o \
                -name "*.kip1" -o \
                -name "*.ovl" -o \
                -name "*.nsp" \
              \) \
              -not -path "./.git/*" \
              -not -path "./artifacts/*" \
              -print0
          )

          echo "=== Artifacts ==="
          find artifacts -type f -print | sort || true

          if ! find artifacts -type f -print -quit | grep -q .; then
            echo "::error::No .nro, .elf, .kip, .kip1, .ovl, or .nsp build artifacts were found."
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ATMOSPHERE_21.5.0_Support
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

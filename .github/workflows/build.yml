name: AMS Build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Get environment information
        run: |
          cat /etc/os-release
          ldd --version

      - name: Install Python dependencies
        run: |
          apt-get update -y
          apt-get install -y python3 python3-lz4

      - name: Build Atmosphère
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          cd troposphere/haze
          make -j"$(nproc)"
          cd ../..

          make -j"$(nproc)"

      - name: Create release timestamp
        env:
          TZ: America/Chicago
        run: |
          echo "NOW=$(date +'%m-%d-%Y-%I.%M.%S.%p')" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: ${{ github.workspace }}/out/nintendo_nx_arm64_armv8a
          if-no-files-found: error

      - name: List release files
        run: |
          ls -la
          ls -la out/nintendo_nx_arm64_armv8a
          ls -la out/nintendo_nx_arm64_armv8a/release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.NOW }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          draft: false
          name: "Switch Release #${{ env.NOW }}"
          body: |
            Automated Atmosphère fork build.

            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
          files: ${{ github.workspace }}/out/nintendo_nx_arm64_armv8a/release/*.*
          fail_on_unmatched_files: true
